[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "intentlock"
version = "0.1.0"
description = "IntentLock: Provenance-aware temporal policy engine for agentic InfraOps using Strands Decider 2B"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "strands-decider[mlx]",
    "strands-agents",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest"]
